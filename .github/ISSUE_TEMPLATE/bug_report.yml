name: Bug report / 故障反馈
description: Report a reproducible issue without credentials or personal logs.
body:
  - type: markdown
    attributes:
      value: 请勿附带账号、密码、个人配置、登录 URL 或未脱敏日志。
  - type: input
    id: version
    attributes:
      label: 程序版本和 Windows 版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与预期行为
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果及脱敏错误信息
    validations:
      required: true
